services:
  - type: web
    name: magic-saas-platform
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r platform_core/requirements.txt"
    startCommand: "python platform_core/run.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: LIFF_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: APP_SECRET_SALT
        sync: false
