services:
  # 1. FastAPI 後端主服務
  - type: web
    name: magic-xray-liff
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: LIFF_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: magic-redis
          property: connectionString

  # 2. 免費 Redis 資料庫 (自動提供狀態鎖定與輪次管理)
  - type: redis
    name: magic-redis
    region: singapore
    plan: free
    ipAllowList: [] # 僅限內部服務互連，安全不對外暴露

